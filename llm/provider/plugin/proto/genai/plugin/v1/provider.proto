syntax = "proto3";

package genai.plugin.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/bornholm/genai/llm/provider/plugin/proto/genai/plugin/v1;pluginv1";

// Provider is served by every plugin binary. It describes what the plugin can
// do and instantiates configured clients.
service Provider {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
}

// ChatCompletion mirrors llm.ChatCompletionClient and
// llm.ChatCompletionStreamingClient.
service ChatCompletion {
  rpc ChatCompletion(ChatCompletionRequest) returns (ChatCompletionResponse);
  rpc ChatCompletionStream(ChatCompletionRequest) returns (stream StreamChunk);
}

// Embeddings mirrors llm.EmbeddingsClient.
service Embeddings {
  rpc Embeddings(EmbeddingsRequest) returns (EmbeddingsResponse);
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_CHAT_COMPLETION = 1;
  CAPABILITY_EMBEDDINGS = 2;
}

message DescribeRequest {}

message DescribeResponse {
  string name = 1;
  string version = 2;
  repeated Capability capabilities = 3;
}

message ConfigureRequest {
  Capability capability = 1;
  // Provider specific options, keyed without their environment prefix
  // (e.g. "MODEL_PATH" for GENAI_CHAT_COMPLETION_YZMA_MODEL_PATH).
  map<string, string> options = 2;
}

message ConfigureResponse {
  string client_id = 1;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_SYSTEM = 2;
  ROLE_ASSISTANT = 3;
  ROLE_TOOL = 4;
  ROLE_TOOL_CALLS = 5;
}

enum AttachmentType {
  ATTACHMENT_TYPE_UNSPECIFIED = 0;
  ATTACHMENT_TYPE_IMAGE = 1;
  ATTACHMENT_TYPE_AUDIO = 2;
  ATTACHMENT_TYPE_VIDEO = 3;
  ATTACHMENT_TYPE_DOCUMENT = 4;
}

enum AttachmentSource {
  ATTACHMENT_SOURCE_UNSPECIFIED = 0;
  ATTACHMENT_SOURCE_BASE64 = 1;
  ATTACHMENT_SOURCE_URL = 2;
}

message Attachment {
  AttachmentType type = 1;
  string mime_type = 2;
  AttachmentSource source = 3;
  string data = 4;
}

message CacheControl {
  string type = 1;
  optional string ttl = 2;
}

message ReasoningDetail {
  string id = 1;
  string type = 2;
  string text = 3;
  string summary = 4;
  string data = 5;
  string format = 6;
  int32 index = 7;
  string signature = 8;
}

message ToolCall {
  string id = 1;
  string name = 2;
  // JSON encoded parameters.
  string parameters_json = 3;
}

// Message is the wire form of every llm.Message implementation. The fields
// that are set decide which constructor the receiving side uses.
message Message {
  Role role = 1;
  string content = 2;
  repeated Attachment attachments = 3;
  CacheControl cache_control = 4;
  // Set on tool result messages (llm.ToolMessage).
  string tool_call_id = 5;
  // Set on tool call messages (llm.ToolCallsMessage).
  repeated ToolCall tool_calls = 6;
  // Set on reasoning messages (llm.ReasoningMessage).
  string reasoning = 7;
  repeated ReasoningDetail reasoning_details = 8;
}

// Tool is a descriptor only: execution stays on the host side.
message Tool {
  string name = 1;
  string description = 2;
  google.protobuf.Struct parameters = 3;
}

message ResponseSchema {
  string name = 1;
  string description = 2;
  google.protobuf.Value schema = 3;
  bool strict = 4;
}

message ReasoningOptions {
  optional string effort = 1;
  optional int64 max_tokens = 2;
  bool exclude = 3;
  optional bool enabled = 4;
}

message AudioOutputConfig {
  string voice = 1;
  string format = 2;
}

message ChatCompletionOptions {
  repeated Message messages = 1;
  repeated Tool tools = 2;
  string tool_choice = 3;
  optional double temperature = 4;
  string response_format = 5;
  ResponseSchema response_schema = 6;
  optional int64 seed = 7;
  optional int64 max_completion_tokens = 8;
  ReasoningOptions reasoning = 9;
  repeated string modalities = 10;
  AudioOutputConfig audio = 11;
  string session_id = 12;
  google.protobuf.Struct extra_fields = 13;
}

message ChatCompletionRequest {
  string client_id = 1;
  ChatCompletionOptions options = 2;
}

message Usage {
  int64 prompt_tokens = 1;
  int64 completion_tokens = 2;
  int64 total_tokens = 3;
  int64 cached_tokens = 4;
  int64 cache_creation_tokens = 5;
  optional double cost = 6;
  string cost_currency = 7;
}

message ChatCompletionResponse {
  Message message = 1;
  repeated ToolCall tool_calls = 2;
  Usage usage = 3;
  string reasoning = 4;
  repeated ReasoningDetail reasoning_details = 5;
}

enum StreamChunkType {
  STREAM_CHUNK_TYPE_UNSPECIFIED = 0;
  STREAM_CHUNK_TYPE_DELTA = 1;
  STREAM_CHUNK_TYPE_USAGE = 2;
  STREAM_CHUNK_TYPE_ERROR = 3;
  STREAM_CHUNK_TYPE_COMPLETE = 4;
}

message ToolCallDelta {
  int32 index = 1;
  string id = 2;
  string name = 3;
  string parameters_delta = 4;
}

message StreamDelta {
  Role role = 1;
  string content = 2;
  repeated ToolCallDelta tool_calls = 3;
  string reasoning = 4;
  repeated ReasoningDetail reasoning_details = 5;
  string audio_data = 6;
  string transcript = 7;
}

message StreamChunk {
  StreamChunkType type = 1;
  StreamDelta delta = 2;
  Usage usage = 3;
  Error error = 4;
}

message EmbeddingsRequest {
  string client_id = 1;
  repeated string inputs = 2;
  optional int64 dimensions = 3;
}

message Embedding {
  repeated double values = 1;
}

message EmbeddingsUsage {
  int64 prompt_tokens = 1;
  int64 total_tokens = 2;
}

message EmbeddingsResponse {
  repeated Embedding embeddings = 1;
  EmbeddingsUsage usage = 2;
}

// Error carries the parts of an llm error that the host needs to rebuild a
// typed error, so that llm.IsRetryable and errors.Is/As keep working across
// the process boundary.
message Error {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_HTTP = 1;
    KIND_RATE_LIMIT = 2;
    KIND_NO_MESSAGE = 3;
    KIND_UNAVAILABLE = 4;
    KIND_VALIDATION = 5;
  }
  string message = 1;
  Kind kind = 2;
  int32 status_code = 3;
  string body = 4;
  string field = 5;
}
