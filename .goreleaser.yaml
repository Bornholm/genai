version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: genai
    targets: [linux_amd64_v1]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./cmd/genai
    env:
      - CGO_ENABLED=0
    flags:
      # trims path
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: genai-provider-yzma
    binary: genai-provider-yzma
    targets: [linux_amd64_v1]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/yzma
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
# Without this, goreleaser puts every build in one archive: the plugin would
# double the size of the archive of anyone who only wants the CLI.
archives:
  - id: genai
    ids: [genai]
  - id: genai-provider-yzma
    ids: [genai-provider-yzma]
    name_template: "genai-provider-yzma_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  name_template: "v{{ .Version }}"
